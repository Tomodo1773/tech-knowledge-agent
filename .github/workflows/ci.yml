name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Add Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          working-directory: src/functions

      - name: Sync Functions dependencies
        run: sfw uv sync --project src/functions --locked

      - name: Check Functions
        run: |
          uv run --project src/functions --no-sync ruff check src/functions scripts
          uv run --project src/functions --no-sync pytest src/functions/tests
          uv export --quiet --project src/functions --frozen --no-dev --no-emit-project --output-file src/functions/requirements.txt
          uv run --project src/functions --no-sync python scripts/check-python-package-layout.py src/functions .funcignore function_app.py host.json requirements.txt

      - name: Sync Agent dependencies
        run: sfw uv sync --project src/agent --locked

      - name: Check Agent
        run: |
          uv run --project src/agent --no-sync ruff check src/agent
          uv run --project src/agent --no-sync pytest src/agent/tests
          uv export --quiet --project src/agent --frozen --no-dev --no-emit-project --output-file src/agent/requirements.txt
          uv run --project src/agent --no-sync python scripts/check-python-package-layout.py src/agent .azdignore main.py requirements.txt

      - name: Build Bicep
        # Restores the pinned AVM modules from mcr.microsoft.com and type-checks the
        # templates. No Azure login and no deployment.
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Check repository policy
        shell: pwsh
        run: |
          ./scripts/check-repository-policy.ps1
          ./scripts/check-infra-policy.ps1
