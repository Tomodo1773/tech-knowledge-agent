  <title id="diagram-title">Tech knowledge agent architecture</title>
  <desc id="diagram-desc">Structural architecture view. A user reaches a Slack app, while a private GitHub article repository feeds a single Azure Function App. The Function App contains sync, Slack event, and worker functions. Microsoft Foundry provides the hosted agent and models, and Azure Cosmos DB is the rightmost knowledge store. Supporting Key Vault, Storage Account, and Application Insights resources appear below. Arrows show dependencies and major data access, not a complete request and response timeline.</desc>
