# Foundryのbatch evaluationへ渡す判定器の定義。
#
# このファイルとpromptの内容から指紋を計算し、指紋ごとに評価の枠を作り分ける。ここを変えると
# 次の実行から新しい枠になるので、採点基準を変えたrunと変える前のrunが混ざることはない。
#
# 判定modelのdeployment名はここへ書かず、環境変数AZURE_AI_MODEL_DEPLOYMENT_NAMEから取る。
# 名前も指紋に含めるため、modelを差し替えても枠は分かれる。

stage: 1

criteria:
  # (1) 回答の内容が期待と合っているか。根拠が無いときに無いと言えるかも、caseごとの
  # expectedBehaviorの書き分けでこの判定器が吸収する。
  - type: score_model
    name: answer_quality
    # developerメッセージ。出力形式は書かない。判定と理由という出力contractはFoundryが
    # 強制的に付け足すため、独自の形式を書くと衝突して壊れる。
    promptFile: answer-quality.md
    # userメッセージ。判定modelが見るものはすべてこのファイルから追える。
    input: |
      # 質問

      {{item.query}}

      # 期待する振る舞い

      {{item.expectedBehavior}}

      # エージェントの回答

      {{sample.output_text}}
    range: [1, 5]
    passThreshold: 4

  # (5) 正解記事をsourceとして挙げたか。judge modelを使わない決定的判定。
  # likeは「inputがreferenceを含む」判定。回答本文には記事pathを含むcommit URLが出る。
  - type: string_check
    name: cited_expected_source
    operation: like
    input: '{{sample.output_text}}'
    reference: '{{item.expectedSource}}'

  # 以下は組み込み評価器。判定modelはサービス側の既定を使うため、AZURE_AI_MODEL_DEPLOYMENT_NAME
  # を差し替えても指紋は変わらない。組み込み分だけは採点条件が指紋の外にある。
  #
  # 組み込み評価器の名前にはbuiltin.を付ける。付けないと作成時に404になる。
  #
  # dataMappingは省略できない。ここのitem項目名はcamelCaseで、評価器が期待する
  # query / response と綴りが一致しないため、明示しないと作成時に弾かれる。
  #
  # 判定modelのdeployment名はここへ書かず、score_modelと同じく環境変数から入れる。
  # 組み込み評価器も明示しないと作成時に弾かれる。指紋にも含まれる。
  #
  # ツール評価器はtool_callsも要る。作成時の必須ではないので指定しなくても通るが、
  # 実際のツール呼び出しが見えず「評価対象が無い」として全行スキップされる。

  # (2) 呼ぶべきツールを呼んだか。tool_definitionsはitem項目からしか届かない。
  # Agent対象設定のツール説明として渡す経路では実行時に届かず、全行エラーになる。
  - type: azure_ai_evaluator
    name: tool_call_accuracy
    evaluatorName: builtin.tool_call_accuracy
    dataMapping:
      query: '{{item.query}}'
      # 最終テキストではなく往復全体。ツールの出力はこちらにしか入っていない。
      response: '{{sample.output_items}}'
      tool_calls: '{{sample.tool_calls}}'
      tool_definitions: '{{item.toolDefinitions}}'

  # (3) ツールへ渡した引数が妥当か。
  - type: azure_ai_evaluator
    name: tool_input_accuracy
    evaluatorName: builtin.tool_input_accuracy
    dataMapping:
      query: '{{item.query}}'
      # 最終テキストではなく往復全体。ツールの出力はこちらにしか入っていない。
      response: '{{sample.output_items}}'
      tool_calls: '{{sample.tool_calls}}'
      tool_definitions: '{{item.toolDefinitions}}'

  # (4) ツールが返したものを回答に活かせたか。記事に裏付けのない主張の付け足しは
  # これが捉える。自作のanswer_qualityは素通りさせていた。
  - type: azure_ai_evaluator
    name: tool_output_utilization
    evaluatorName: builtin.tool_output_utilization
    dataMapping:
      query: '{{item.query}}'
      # 最終テキストではなく往復全体。ツールの出力はこちらにしか入っていない。
      response: '{{sample.output_items}}'
      tool_calls: '{{sample.tool_calls}}'
      tool_definitions: '{{item.toolDefinitions}}'

  # (6) 質問に対して的を射た回答か。
  - type: azure_ai_evaluator
    name: relevance
    evaluatorName: builtin.relevance
    dataMapping:
      query: '{{item.query}}'
      response: '{{sample.output_text}}'

  # (7) 依頼された作業を最後までやったか。
  - type: azure_ai_evaluator
    name: task_adherence
    evaluatorName: builtin.task_adherence
    dataMapping:
      query: '{{item.query}}'
      response: '{{sample.output_text}}'

  # (8) 質問の意図を取り違えていないか。
  - type: azure_ai_evaluator
    name: intent_resolution
    evaluatorName: builtin.intent_resolution
    dataMapping:
      query: '{{item.query}}'
      response: '{{sample.output_text}}'
